<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Примеры работ — ОТДИС</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f0f2f5;
            padding: 16px;
        }
        .container {
            max-width: 550px;
            margin: 0 auto;
        }
        .header {
            background: linear-gradient(135deg, #1a56db 0%, #0e3a9e 100%);
            color: white;
            padding: 16px;
            border-radius: 20px;
            margin-bottom: 20px;
            text-align: center;
        }
        .back-button {
            background: white;
            color: #1a56db;
            padding: 10px 16px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 16px;
            display: inline-block;
            text-decoration: none;
        }
        .gallery {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .example-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .example-card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            display: block;
        }
        .example-card .title {
            padding: 8px;
            font-size: 12px;
            text-align: center;
            color: #555;
        }
    </style>
</head>
<body>
<div class="container">
    <a href="index.html" class="back-button">← Назад</a>
    <div class="header">
        <h2>🎨 Примеры работ</h2>
        <p>Рисунок и живопись абитуриентов</p>
    </div>
    <div class="gallery">
        <div class="example-card">
            <img src="images/Рисунок1.jpg" alt="Рисунок 1">
            <div class="title">Рисунок карандашом — работа абитуриента</div>
        </div>
        <div class="example-card">
            <img src="images/Рисунок2.jpg" alt="Рисунок 2">
            <div class="title">Рисунок карандашом — геометрическая постановка</div>
        </div>
        <div class="example-card">
            <img src="images/Рисунок3.jpg" alt="Рисунок 3">
            <div class="title">Рисунок карандашом — натюрморт</div>
        </div>
        <div class="example-card">
            <img src="images/Живопись1.jpg" alt="Живопись 1">
            <div class="title">Живопись красками — натюрморт</div>
        </div>
        <div class="example-card">
            <img src="images/Живопись2.jpg" alt="Живопись 2">
            <div class="title">Живопись красками — бытовой натюрморт</div>
        </div>
        <div class="example-card">
            <img src="images/Живопись3.jpg" alt="Живопись 3">
            <div class="title">Живопись красками — цветочная композиция</div>
        </div>
    </div>
</div>
</body>
</html>
