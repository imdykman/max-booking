<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>ОТДИС — Приёмная комиссия</title>
    <script src="https://st.max.ru/js/max-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f0f2f5;
            padding: 0;
            margin: 0;
        }
        .container {
            max-width: 550px;
            margin: 0 auto;
            padding: 12px;
            width: 100%;
        }
        .header {
            background: linear-gradient(135deg, #1a56db 0%, #0e3a9e 100%);
            color: white;
            padding: 16px;
            border-radius: 20px;
            margin-bottom: 20px;
            text-align: center;
            cursor: pointer;
            width: 100%;
        }
        .header:active { opacity: 0.8; }
        .header h1 { font-size: 22px; margin-bottom: 5px; }
        .header p { font-size: 13px; opacity: 0.9; }
        .info-page, .main-menu, .booking-section, .instruction-page {
            width: 100%;
            background: white;
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .info-header {
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
            margin-bottom: 12px;
        }
        .back-button {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            padding: 0 6px;
        }
        .info-title {
            font-size: 17px;
            font-weight: 600;
            color: #1a56db;
        }
        .info-content {
            font-size: 14px;
            line-height: 1.4;
            color: #333;
            white-space: pre-line;
        }
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
        }
        .menu-btn {
            background: white;
            border: none;
            border-radius: 14px;
            padding: 10px 6px;
            text-align: center;
            font-size: 13px;
            font-weight: 500;
            color: #1a56db;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            width: 100%;
            min-width: 0;
            line-height: 1.3;
            word-break: break-word;
            white-space: normal;
        }
        .menu-btn:active { transform: scale(0.97); background-color: #e8eef9; }
        .menu-btn .emoji { font-size: 26px; display: block; }
        .directions-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }
        .direction-category {
            background: #f8f9fa;
            border-radius: 14px;
            padding: 10px;
            border-left: 4px solid #1a56db;
        }
        .category-title {
            font-weight: 700;
            font-size: 14px;
            margin-bottom: 10px;
            color: #1a56db;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .direction-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 0;
            border-bottom: 1px solid #e9ecef;
        }
        .direction-item:last-child { border-bottom: none; }
        .direction-icon { font-size: 20px; min-width: 32px; text-align: center; }
        .direction-name { font-size: 13px; color: #333; line-height: 1.3; }
        .calendar {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            margin: 12px 0;
            width: 100%;
        }
        .weekday, .day {
            text-align: center;
            padding: 6px 0;
            border-radius: 8px;
            font-size: 12px;
        }
        .weekday { font-size: 11px; color: #888; font-weight: 600; }
        .day { background-color: #f0f2f5; cursor: pointer; }
        .day.available { background-color: #e3f2fd; color: #1a56db; }
        .day.selected { background-color: #1a56db; color: white; }
        .day.disabled { background-color: #e9ecef; color: #adb5bd; cursor: not-allowed; }
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .nav-btn {
            background-color: #e9ecef;
            padding: 5px 10px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
        }
        .time-slots {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin: 12px 0;
            width: 100%;
        }
        .time-slot {
            text-align: center;
            padding: 6px;
            background-color: #e3f2fd;
            border-radius: 10px;
            cursor: pointer;
            font-size: 12px;
        }
        .time-slot.selected { background-color: #1a56db; color: white; }
        .form-group { margin: 12px 0; }
        label { display: block; margin-bottom: 4px; color: #555; font-size: 12px; }
        input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 13px;
        }
        .booking-btn, .instruction-btn {
            background-color: #28a745;
            color: white;
            padding: 10px;
            font-size: 14px;
        }
        .instruction-btn {
            background-color: #1a56db;
            margin-top: 12px;
        }
        button {
            width: 100%;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }
        .hidden { display: none; }
        .footer-link {
            text-align: center;
            padding: 12px;
        }
        .footer-link a {
            color: #1a56db;
            text-decoration: none;
            font-size: 12px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header" onclick="goToMainMenu()">
        <h1>📚 ОТДИС</h1>
        <p>Приёмная комиссия 2026</p>
    </div>

    <div id="mainMenu" class="main-menu">
        <div class="menu-grid">
    <button class="menu-btn" onclick="showDirections()"><span class="emoji">🎓</span>Направления</button>
    <button class="menu-btn" onclick="showInfoPage('scores')"><span class="emoji">📊</span>Средние баллы</button>
    <button class="menu-btn" onclick="showInfoPage('documents')"><span class="emoji">📋</span>Документы</button>
    <button class="menu-btn" onclick="showBooking()"><span class="emoji">📅</span>Запись</button>
    <button class="menu-btn" onclick="showInfoPage('prof')"><span class="emoji">🧵</span>Профессионалитет</button>
    <button class="menu-btn" onclick="showInfoPage('contacts')"><span class="emoji">📍</span>Контакты</button>
</div>
         </div>

    <!-- Промежуточная страница-инструкция (компактная) -->
    <div id="instructionPage" class="instruction-page hidden">
        <div class="info-header">
            <button class="back-button" onclick="hideInstruction()">← Назад</button>
            <div class="info-title">📋 Отправка заявки</div>
        </div>
        <div class="info-content" style="padding: 0; margin: 0;">
            <div style="text-align: center;">
                <span style="font-size: 36px;">✉️</span>
            </div>
            <p style="text-align: center; margin: 4px 0 0 0; font-size: 15px;"><strong>Ваши данные готовы!</strong></p>
            
            <div style="background: #f8f9fa; border-radius: 12px; padding: 10px; margin-top: 8px;">
                <div style="display: flex; align-items: center; gap: 10px; padding: 6px 0;">
                    <span style="font-size: 18px;">1️⃣</span>
                    <span style="font-size: 13px;">Выберите чат <strong>«ОТДИС приёмная комиссия»</strong></span>
                </div>
                <div style="display: flex; align-items: center; gap: 10px; padding: 6px 0;">
                    <span style="font-size: 18px;">2️⃣</span>
                    <span style="font-size: 13px;">Нажмите <strong>«Отправить»</strong></span>
                </div>
            </div>
            
            <p style="font-size: 11px; color: #666; text-align: center; margin: 8px 0 0 0;">
                Специалист свяжется с вами
            </p>
            
            <button class="instruction-btn" onclick="shareBooking()" style="margin-top: 12px; padding: 10px;">📨 Отправить заявку</button>
        </div>
    </div>

    <div id="infoPage" class="info-page hidden">
        <div class="info-header">
            <button class="back-button" onclick="goToMainMenu()">←</button>
            <div class="info-title" id="infoTitle"></div>
        </div>
        <div class="info-content" id="infoContent"></div>
    </div>

    <div id="directionsPage" class="info-page hidden">
        <div class="info-header">
            <button class="back-button" onclick="goToMainMenu()">←</button>
            <div class="info-title">Направления подготовки</div>
        </div>
        <div class="info-content" id="directionsList"></div>
    </div>

    <div id="bookingSection" class="booking-section hidden">
        <div class="nav-buttons">
            <div class="nav-btn" onclick="hideBooking()">◀️ Назад</div>
            <div class="month" id="monthDisplay"></div>
            <div class="nav-btn" onclick="nextMonth()">▶️</div>
        </div>
        <div class="calendar" id="calendar"></div>
        <div id="timeSection" class="hidden">
            <h2 style="font-size:13px; margin:8px 0;">🕐 Выберите время</h2>
            <div class="time-slots" id="timeSlots"></div>
        </div>
        <div id="formSection" class="hidden">
            <div class="form-group">
                <label>📝 Ваше имя</label>
                <input type="text" id="userName" placeholder="Иванов Иван">
            </div>
            <div class="form-group">
                <label>📞 Телефон</label>
                <input type="tel" id="phone" placeholder="+7 912 345 67 89">
            </div>
            <button class="booking-btn" onclick="prepareBooking()">✅ Записаться</button>
        </div>
    </div>

    <div class="footer-link">
        <a href="https://otdis.ru" target="_blank">❓ Часто задаваемые вопросы → otdis.ru</a>
    </div>
</div>

<script>
    const contentData = {
        scores: { title: '📊 Средние баллы 2025', text: '• Реклама — 4,1\n• Банковское дело — 3,9\n• Дизайн в СМИ — 4,03\n• КМ и технология — 4,3\n• Мастер швейных изделий — 3,9\n• Оператор швейного оборудования — 3,79' },
        documents: { title: '📋 Список документов', text: '1️⃣ Паспорт\n2️⃣ Аттестат\n3️⃣ Фото 3×4 — 4 шт\n4️⃣ Медсправка 086\n5️⃣ Прививочный сертификат\n6️⃣ Медицинский полис\n7️⃣ СНИЛС\n8️⃣ Документы о льготах\n9️⃣ ИНН\n🔟 Документы об инвалидности\n1️⃣1️⃣ Заключение ПМПК\n1️⃣2️⃣ Приписное\n\n🗓️ Срок подачи: до 15 августа' },
        prof: { title: '💼 Профессионалитет', text: '«Профессионалитет» — новая модель сотрудничества колледжей и работодателей.\n\n• Сокращённые сроки обучения\n• Приоритет практики\n• Целевое обучение и гарантированное трудоустройство\n\nПодробнее: otdis.ru/professionalitet' },
        contacts: { title: '📍 Контакты', text: '📞 +7 (343) 378-17-25 (доб. 3)\n✉️ postupi@otdis.ru\n🌐 otdis.ru\n🏢 г. Екатеринбург, пер. Красный, д. 3\n\nПн-Пт 09:00—16:00\nСб 10:00—14:00' }
    };

    const directionsCategories = [
        { title: "🎓 Бюджетные места", icon: "🎓", items: [
            { icon: "✂️", name: "Конструирование, моделирование и технология швейных изделий" },
            { icon: "🎨", name: "Дизайн (легкая промышленность)" },
            { icon: "🧵", name: "Мастер по изготовлению швейных изделий" },
            { icon: "⚙️", name: "Оператор оборудования швейного производства" },
            { icon: "🎭", name: "Художник по костюму" }
        ]},
        { title: "♿ Для лиц с ОВЗ", icon: "♿", items: [
            { icon: "🪡", name: "Оператор швейного оборудования (швея) — проф. подготовка" }
        ]},
        { title: "💰 Платное обучение", icon: "💰", items: [
            { icon: "📢", name: "Реклама" },
            { icon: "🏦", name: "Банковское дело" },
            { icon: "🎨", name: "Дизайн (СМИ и полиграфия)" }
        ]}
    ];

    let currentUser = { id: null, name: '' };
    let currentDate = new Date();
    let selectedDate = null;
    let selectedTime = null;
    let pendingBookingData = null;

    function goToMainMenu() {
        document.getElementById('mainMenu').classList.remove('hidden');
        document.getElementById('infoPage').classList.add('hidden');
        document.getElementById('directionsPage').classList.add('hidden');
        document.getElementById('bookingSection').classList.add('hidden');
        document.getElementById('instructionPage').classList.add('hidden');
    }

    function showInfoPage(type) {
        const data = contentData[type];
        document.getElementById('infoTitle').innerText = data.title;
        document.getElementById('infoContent').innerText = data.text;
        document.getElementById('mainMenu').classList.add('hidden');
        document.getElementById('infoPage').classList.remove('hidden');
        document.getElementById('directionsPage').classList.add('hidden');
        document.getElementById('bookingSection').classList.add('hidden');
        document.getElementById('instructionPage').classList.add('hidden');
    }

    function showDirections() {
        const container = document.getElementById('directionsList');
        container.innerHTML = directionsCategories.map(cat => `
            <div class="direction-category">
                <div class="category-title">${cat.icon} ${cat.title}</div>
                ${cat.items.map(item => `<div class="direction-item"><div class="direction-icon">${item.icon}</div><div class="direction-name">${item.name}</div></div>`).join('')}
            </div>
        `).join('');
        document.getElementById('mainMenu').classList.add('hidden');
        document.getElementById('directionsPage').classList.remove('hidden');
        document.getElementById('infoPage').classList.add('hidden');
        document.getElementById('bookingSection').classList.add('hidden');
        document.getElementById('instructionPage').classList.add('hidden');
    }

    function hideInstruction() {
        document.getElementById('instructionPage').classList.add('hidden');
        document.getElementById('bookingSection').classList.remove('hidden');
    }

    async function shareBooking() {
        if (!pendingBookingData) return;
        
        const messageText = `ЗАПИСЬ:\nИмя: ${pendingBookingData.user_name}\nТелефон: ${pendingBookingData.phone}\nДата: ${pendingBookingData.date}\nВремя: ${pendingBookingData.time}`;
        
        try {
            if (window.WebApp && typeof window.WebApp.shareMaxContent === 'function') {
                const result = await window.WebApp.shareMaxContent({ 
                    text: messageText 
                });
                
                if (result.status === 'shared') {
                    alert('✅ Заявка успешно отправлена!');
                    goToMainMenu();
                    pendingBookingData = null;
                } else if (result.status === 'cancelled') {
                    alert('❌ Отправка отменена');
                }
            } else {
                await navigator.clipboard.writeText(messageText);
                alert('📋 Текст скопирован в буфер!\n\nВставьте его в чат с ботом.');
                goToMainMenu();
                pendingBookingData = null;
            }
        } catch(e) {
            console.error('Ошибка:', e);
            await navigator.clipboard.writeText(messageText);
            alert('📋 Текст скопирован в буфер!\n\nВставьте его в чат с ботом.');
            goToMainMenu();
            pendingBookingData = null;
        }
    }

    function generateTimeSlots(date) {
        const dayOfWeek = new Date(date).getDay();
        if (dayOfWeek === 0) return [];
        let startHour = (dayOfWeek === 6) ? 10 : 9;
        let endHour = (dayOfWeek === 6) ? 13 : 15;
        const slots = [];
        for (let hour = startHour; hour < endHour; hour++) {
            slots.push(`${hour}:00`);
            if (hour !== endHour - 1) slots.push(`${hour}:30`);
        }
        return slots;
    }

    function renderCalendar() {
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();
        const firstDay = new Date(year, month, 1);
        const lastDay = new Date(year, month + 1, 0);
        const startDayOfWeek = firstDay.getDay();
        const today = new Date(); today.setHours(0,0,0,0);
        const monthNames = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
        document.getElementById('monthDisplay').innerText = `${monthNames[month]} ${year}`;
        let html = '';
        const dayNames = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
        for (let i = 0; i < 7; i++) html += `<div class="weekday">${dayNames[i]}</div>`;
        const offset = (startDayOfWeek === 0 ? 6 : startDayOfWeek - 1);
        for (let i = 0; i < offset; i++) html += `<div class="day disabled"></div>`;
        for (let day = 1; day <= lastDay.getDate(); day++) {
            const date = new Date(year, month, day);
            const isWeekend = date.getDay() === 0;
            const isPast = date < today;
            let className = 'day';
            if (isWeekend || isPast) className += ' disabled';
            else className += ' available';
            if (selectedDate && selectedDate.toDateString() === date.toDateString()) className += ' selected';
            html += `<div class="${className}" onclick="${!isWeekend && !isPast ? `selectDate('${date.toISOString()}')` : ''}">${day}</div>`;
        }
        document.getElementById('calendar').innerHTML = html;
    }

    function selectDate(dateStr) {
        selectedDate = new Date(dateStr);
        selectedTime = null;
        renderCalendar();
        const slots = generateTimeSlots(selectedDate);
        const timeHtml = slots.map(slot => `<div class="time-slot" onclick="selectTime('${slot}')">${slot}</div>`).join('');
        document.getElementById('timeSlots').innerHTML = timeHtml;
        document.getElementById('timeSection').classList.remove('hidden');
        document.getElementById('formSection').classList.add('hidden');
    }

    function selectTime(time) {
        selectedTime = time;
        document.querySelectorAll('.time-slot').forEach(el => el.classList.remove('selected'));
        event.target.classList.add('selected');
        document.getElementById('formSection').classList.remove('hidden');
    }

    function prepareBooking() {
        if (!selectedDate || !selectedTime) { 
            alert('Выберите дату и время'); 
            return; 
        }
        const userName = document.getElementById('userName').value.trim();
        const phone = document.getElementById('phone').value.trim();
        if (!userName || !phone) { 
            alert('Заполните имя и телефон'); 
            return; 
        }

        pendingBookingData = {
            user_name: userName,
            phone: phone,
            date: selectedDate.toISOString().split('T')[0],
            time: selectedTime
        };

        document.getElementById('bookingSection').classList.add('hidden');
        document.getElementById('instructionPage').classList.remove('hidden');
    }

    function showBooking() {
        document.getElementById('mainMenu').classList.add('hidden');
        document.getElementById('bookingSection').classList.remove('hidden');
        document.getElementById('instructionPage').classList.add('hidden');
        renderCalendar();
    }
    
    function hideBooking() { goToMainMenu(); }
    function nextMonth() { currentDate.setMonth(currentDate.getMonth() + 1); renderCalendar(); }
    function prevMonth() { currentDate.setMonth(currentDate.getMonth() - 1); renderCalendar(); }
</script>
</body>
</html>
