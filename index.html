<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>ОТДИС — Приёмная комиссия</title>
    <script src="https://st.max.ru/js/max-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f0f2f5;
            padding: 0;
            margin: 0;
        }
        .container {
            max-width: 550px;
            margin: 0 auto;
            padding: 12px;
            width: 100%;
        }
        .header {
            background: linear-gradient(135deg, #1a56db 0%, #0e3a9e 100%);
            color: white;
            padding: 16px;
            border-radius: 20px;
            margin-bottom: 20px;
            text-align: center;
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        .header:active { opacity: 0.8; }
        .header-logo {
            width: 60px;
            height: 60px;
            object-fit: contain;
        }
        .header-text {
            text-align: left;
        }
        .header h1 { font-size: 22px; margin-bottom: 5px; }
        .header p { font-size: 13px; opacity: 0.9; margin: 0; }
        .info-page, .main-menu, .booking-section, .instruction-page {
            width: 100%;
            background: white;
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .info-header {
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
            margin-bottom: 12px;
        }
        .back-button {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            padding: 0 6px;
        }
        .info-title {
            font-size: 17px;
            font-weight: 600;
            color: #1a56db;
        }
        .info-content {
            font-size: 14px;
            line-height: 1.4;
            color: #333;
            white-space: pre-line;
        }
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
        }
        .menu-btn {
            background: white;
            border: none;
            border-radius: 14px;
            padding: 10px 6px;
            text-align: center;
            font-size: 13px;
            font-weight: 500;
            color: #1a56db;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            width: 100%;
            min-width: 0;
            line-height: 1.3;
            word-break: break-word;
            white-space: normal;
        }
        .menu-btn:active { transform: scale(0.97); background-color: #e8eef9; }
        .menu-btn .emoji { font-size: 26px; display: block; }
        .directions-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }
        .direction-category {
            background: #f8f9fa;
            border-radius: 14px;
            padding: 10px;
            border-left: 4px solid #1a56db;
        }
        .category-title {
            font-weight: 700;
            font-size: 14px;
            margin-bottom: 10px;
            color: #1a56db;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .direction-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 0;
            border-bottom: 1px solid #e9ecef;
        }
        .direction-item:last-child { border-bottom: none; }
        .direction-icon { font-size: 20px; min-width: 32px; text-align: center; }
        .direction-name { font-size: 13px; color: #333; line-height: 1.3; }
        .calendar {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            margin: 12px 0;
            width: 100%;
        }
        .weekday, .day {
            text-align: center;
            padding: 6px 0;
            border-radius: 8px;
            font-size: 12px;
        }
        .weekday { font-size: 11px; color: #888; font-weight: 600; }
        .day { background-color: #f0f2f5; cursor: pointer; }
        .day.available { background-color: #e3f2fd; color: #1a56db; }
        .day.selected { background-color: #1a56db; color: white; }
        .day.disabled { background-color: #e9ecef; color: #adb5bd; cursor: not-allowed; }
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .nav-btn {
            background-color: #e9ecef;
            padding: 5px 10px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
        }
        .time-slots {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin: 12px 0;
            width: 100%;
        }
        .time-slot {
            text-align: center;
            padding: 6px;
            background-color: #e3f2fd;
            border-radius: 10px;
            cursor: pointer;
            font-size: 12px;
        }
        .time-slot.selected { background-color: #1a56db; color: white; }
        .form-group { margin: 12px 0; }
        label { display: block; margin-bottom: 4px; color: #555; font-size: 12px; }
        input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 13px;
        }
        .booking-btn, .instruction-btn {
            background-color: #28a745;
            color: white;
            padding: 10px;
            font-size: 14px;
        }
        .instruction-btn {
            background-color: #1a56db;
            margin-top: 12px;
        }
        button {
            width: 100%;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }
        .hidden { display: none; }
        .footer-link {
            text-align: center;
            padding: 12px;
        }
        .footer-link a {
            color: #1a56db;
            text-decoration: none;
            font-size: 12px;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeIn 0.2s ease;
        }
        
        .modal {
            background: white;
            border-radius: 20px;
            max-width: 300px;
            width: 85%;
            padding: 24px 20px;
            text-align: center;
            animation: slideUp 0.2s ease;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        
        .modal-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }
        
        .modal-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }
        
        .modal-message {
            font-size: 14px;
            color: #666;
            margin-bottom: 20px;
            line-height: 1.4;
            white-space: pre-line;
        }
        
        .modal-button {
            background-color: #1a56db;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            width: 100%;
            margin-top: 0;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>

    function showAlert(message, type = 'info') {
        return new Promise((resolve) => {
            const overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            
            let icon = 'ℹ️';
            if (type === 'success') icon = '✅';
            if (type === 'error') icon = '❌';
            if (type === 'warning') icon = '⚠️';
            
            overlay.innerHTML = `
                <div class="modal">
                    <div class="modal-icon">${icon}</div>
                    <div class="modal-title">ОТДИС</div>
                    <div class="modal-message">${message}</div>
                    <button class="modal-button">Хорошо</button>
                </div>
            `;
            
            document.body.appendChild(overlay);
            const button = overlay.querySelector('.modal-button');
            button.onclick = () => {
                overlay.remove();
                resolve();
            };
        });
    }

    function generateTimeSlots(date) {
        const dayOfWeek = new Date(date).getDay();
        if (dayOfWeek === 0) return [];
        let startHour = (dayOfWeek === 6) ? 10 : 9;
        let endHour = (dayOfWeek === 6) ? 13 : 15;
        const slots = [];
        for (let hour = startHour; hour < endHour; hour++) {
            slots.push(`${hour}:00`);
            if (hour !== endHour - 1) slots.push(`${hour}:30`);
        }
        return slots;
    }

        const startDayOfWeek = firstDay.getDay();
        const today = new Date(); 
        today.setHours(0,0,0,0);
        const monthNames = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
        
        document.getElementById('monthDisplay').innerText = `${monthNames[month]} ${year}`;
        
        let html = '';
        const dayNames = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
        for (let i = 0; i < 7; i++) {
            html += `<div class="weekday">${dayNames[i]}</div>`;
        }
        
        const offset = (startDayOfWeek === 0 ? 6 : startDayOfWeek - 1);
        for (let i = 0; i < offset; i++) {
            html += `<div class="day disabled"></div>`;
        }
        
        for (let day = 1; day <= lastDay.getDate(); day++) {
            const date = new Date(year, month, day);
            const isWeekend = date.getDay() === 0;
            const isPast = date < today;
            let className = 'day';
            
            if (isWeekend || isPast) {
                className += ' disabled';
            } else {
                className += ' available';
            }
            
            if (selectedDate && selectedDate.toDateString() === date.toDateString()) {
                className += ' selected';
            }
            
            if (!isWeekend && !isPast) {
                html += `<div class="${className}" onclick="selectDateFromCalendar('${date.toISOString()}')">${day}</div>`;
            } else {
                html += `<div class="${className}">${day}</div>`;
            }
        }
        
        document.getElementById('calendar').innerHTML = html;
    }

    function selectDateFromCalendar(dateStr) {
        selectedDate = new Date(dateStr);
        selectedTime = null;
        renderCalendar();
        
        const slots = generateTimeSlots(selectedDate);
        const timeHtml = slots.map(slot => 
            `<div class="time-slot" onclick="selectTime('${slot}')">${slot}</div>`
        ).join('');
        
        document.getElementById('timeSlots').innerHTML = timeHtml;
        document.getElementById('timeSection').classList.remove('hidden');
        document.getElementById('formSection').classList.add('hidden');
    }

    function selectTime(time) {
        selectedTime = time;
        
        const allTimeSlots = document.querySelectorAll('.time-slot');
        allTimeSlots.forEach(el => el.classList.remove('selected'));
        
        let targetSlot = null;
        for (let slot of allTimeSlots) {
            if (slot.textContent === time) {
                targetSlot = slot;
                break;
            }
        }
        
        if (targetSlot) {
            targetSlot.classList.add('selected');
        }
        
        document.getElementById('formSection').classList.remove('hidden');
    }

    async function prepareBooking() {
        if (!selectedDate) { 
            await showAlert('Пожалуйста, выберите дату', 'warning');
            return; 
        }
        
        if (!selectedTime) { 
            await showAlert('Пожалуйста, выберите время', 'warning');
            return; 
        }
        
        const userName = document.getElementById('userName').value.trim();
        if (!userName) { 
            await showAlert('Пожалуйста, введите ваше имя', 'warning');
            document.getElementById('userName').focus();
            return; 
        }
        
        if (userName.length < 2) {
            await showAlert('Имя должно содержать хотя бы 2 символа', 'warning');
            document.getElementById('userName').focus();
            return;
        }
        
        const phone = document.getElementById('phone').value.trim();
        if (!phone) { 
            await showAlert('Пожалуйста, введите номер телефона', 'warning');
            document.getElementById('phone').focus();
            return; 
        }
        
        const phoneRegex = /^[\+\d\s\-\(\)]{10,}$/;
        if (!phoneRegex.test(phone)) {
            await showAlert('Введите корректный номер телефона\n(например: +7 912 345 67 89)', 'warning');
            document.getElementById('phone').focus();
            return;
        }

        pendingBookingData = {
            user_name: userName,
            phone: phone,
            date: selectedDate.toISOString().split('T')[0],
            time: selectedTime,
            timestamp: new Date().toISOString()
        };

        // Показываем страницу с инструкцией
        document.getElementById('bookingSection').classList.add('hidden');
        document.getElementById('instructionPage').classList.remove('hidden');
    }

    // Функция для отправки через мессенджер
    function shareBooking() {
        if (!pendingBookingData) return;
        
        const messageText = `ОТДИС - Приёмная комиссия\n\nНовая запись\n\nИмя: ${pendingBookingData.user_name}\nТелефон: ${pendingBookingData.phone}\nДата: ${pendingBookingData.date}\nВремя: ${pendingBookingData.time}`;
        
        // Пытаемся отправить через WebApp (для телефона и веб-версии Max)
        if (window.WebApp && typeof window.WebApp.shareMaxContent === 'function') {
            window.WebApp.shareMaxContent({ text: messageText }).then(result => {
                if (result.status === 'shared') {
                    showAlert('✅ Заявка отправлена! Специалист свяжется с вами.', 'success');
                }
                clearBookingForm();
                goToMainMenu();
            }).catch(() => {
                showAlert('❌ Ошибка при отправке', 'error');
                clearBookingForm();
                goToMainMenu();
            });
        } else {
            // Для обычного браузера - копируем в буфер
            navigator.clipboard.writeText(messageText).then(() => {
                showAlert('✅ Данные скопированы!\n\nОткройте чат "ОТДИС приёмная комиссия" и вставьте текст (Ctrl+V)', 'success');
                clearBookingForm();
                goToMainMenu();
            }).catch(() => {
                showAlert('❌ Не удалось скопировать данные', 'error');
                clearBookingForm();
                goToMainMenu();
            });
        }
    }

    function clearBookingForm() {
        document.getElementById('userName').value = '';
        document.getElementById('phone').value = '';
        selectedDate = null;
        selectedTime = null;
        pendingBookingData = null;
        document.getElementById('timeSection').classList.add('hidden');
        document.getElementById('formSection').classList.add('hidden');
        if (document.getElementById('bookingSection') && !document.getElementById('bookingSection').classList.contains('hidden')) {
            renderCalendar();
        }
    }

    function showBooking() {
        document.getElementById('mainMenu').classList.add('hidden');
        document.getElementById('bookingSection').classList.remove('hidden');
        document.getElementById('instructionPage').classList.add('hidden');
        renderCalendar();
    }
    
    function nextMonth() { 
        currentDate.setMonth(currentDate.getMonth() + 1); 
        renderCalendar(); 
    }
    
    function prevMonth() { 
        currentDate.setMonth(currentDate.getMonth() - 1); 
        renderCalendar(); 
    }

    function initPhoneMask() {
        const phoneInput = document.getElementById('phone');
        if (phoneInput) {
            phoneInput.addEventListener('input', function(e) {
                let value = e.target.value.replace(/\D/g, '');
                if (value.length > 11) value = value.slice(0, 11);
                let formatted = '';
                if (value.length > 0) {
                    formatted = '+7';
                    if (value.length > 1) formatted += ' ' + value.slice(1, 4);
                    if (value.length >= 5) formatted += ' ' + value.slice(4, 7);
                    if (value.length >= 8) formatted += ' ' + value.slice(7, 9);
                    if (value.length >= 10) formatted += ' ' + value.slice(9, 11);
                }
                e.target.value = formatted;
            });
        }
    }

    document.addEventListener('DOMContentLoaded', function() {
        initPhoneMask();
    });
</script>
