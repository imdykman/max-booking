            padding: 0;
            margin: 0;
        }
        .container {

            margin: 0 auto;
            padding: 12px;
            width: 100%;
        }
        .header {

            color: white;
            padding: 16px;
            border-radius: 20px;
            margin-bottom: 20px;
            text-align: center;
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        .header:active { opacity: 0.8; }
        .header-logo {
            width: 60px;
            height: 60px;
            object-fit: contain;
        }
        .header-text {
            text-align: left;
        }
        .header h1 { font-size: 22px; margin-bottom: 5px; }
        .header p { font-size: 13px; opacity: 0.9; margin: 0; }
        .info-page, .main-menu, .booking-section, .instruction-page, .direction-detail-page {
            width: 100%;
            background: white;
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .info-header {
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
            margin-bottom: 12px;
        }
        .back-button {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            padding: 0 6px;
        }
        .info-title {
            font-size: 17px;
            font-weight: 600;
            color: #1a56db;
        }
        .info-content {
            font-size: 14px;
            line-height: 1.4;
            color: #333;
            white-space: pre-line;
        }
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
        }
        .menu-btn {
            background: white;
            border: none;
            border-radius: 14px;
            padding: 10px 6px;
            text-align: center;
            font-size: 13px;
            font-weight: 500;
            color: #1a56db;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            width: 100%;
            min-width: 0;
            line-height: 1.3;
            word-break: break-word;
            white-space: normal;
        }
        .menu-btn:active { transform: scale(0.97); background-color: #e8eef9; }
        .menu-btn .emoji { font-size: 26px; display: block; }
        .directions-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }
        .direction-category {
            background: #f8f9fa;
            border-radius: 14px;
            padding: 10px;
            border-left: 4px solid #1a56db;
        }
        .category-title {
            font-weight: 700;
            font-size: 14px;
            margin-bottom: 10px;
            color: #1a56db;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .direction-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 0;
            border-bottom: 1px solid #e9ecef;
            cursor: pointer;
            transition: all 0.2s;
        }
        .direction-item:active {
            background-color: #e8eef9;
            transform: scale(0.98);
        }
        .direction-item:last-child { border-bottom: none; }
        .direction-icon { font-size: 20px; min-width: 32px; text-align: center; }
        .direction-name { font-size: 13px; color: #333; line-height: 1.3; }
        .detail-block {
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid #eee;
        }
        .detail-label {
            font-size: 12px;
            color: #888;
            margin-bottom: 4px;
        }
        .detail-value {
            font-size: 15px;
            font-weight: 500;
            color: #333;
        }
        .price {
            font-size: 18px;
            font-weight: 700;
            color: #1a56db;
        }
        .calendar {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            margin: 12px 0;
            width: 100%;
        }

            text-align: center;
            padding: 6px 0;
            border-radius: 8px;
            font-size: 12px;
        }
        .weekday { font-size: 11px; color: #888; font-weight: 600; }
        .day { background-color: #f0f2f5; cursor: pointer; }
        .day.available { background-color: #e3f2fd; color: #1a56db; }
        .day.selected { background-color: #1a56db; color: white; }
        .day.disabled { background-color: #e9ecef; color: #adb5bd; cursor: not-allowed; }

            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .nav-btn {
            background-color: #e9ecef;
            padding: 5px 10px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
        }
        .time-slots {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin: 12px 0;
            width: 100%;
        }
        .time-slot {
            text-align: center;
            padding: 6px;
            background-color: #e3f2fd;
            border-radius: 10px;
            cursor: pointer;
            font-size: 12px;
        }
        .time-slot.selected { background-color: #1a56db; color: white; }
        .form-group { margin: 12px 0; }
        label { display: block; margin-bottom: 4px; color: #555; font-size: 12px; }
        input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 13px;
        }
        .booking-btn, .instruction-btn {
            background-color: #28a745;
            color: white;
            padding: 10px;
            font-size: 14px;
        }
        .instruction-btn {
            background-color: #1a56db;
            margin-top: 12px;
        }
        button {
            width: 100%;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }
        .hidden { display: none; }
        .footer-link {
            text-align: center;
            padding: 12px;
        }
        .footer-link a {
            color: #1a56db;
            text-decoration: none;
            font-size: 12px;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeIn 0.2s ease;
        }
        
        .modal {
            background: white;
            border-radius: 20px;
            max-width: 300px;
            width: 85%;
            padding: 24px 20px;
            text-align: center;
            animation: slideUp 0.2s ease;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        
        .modal-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }
        
        .modal-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }
        
        .modal-message {
            font-size: 14px;
            color: #666;
            margin-bottom: 20px;
            line-height: 1.4;
            white-space: pre-line;
        }
        
        .modal-button {
            background-color: #1a56db;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            width: 100%;
            margin-top: 0;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

            font-weight: 600;
            color: #1a56db;
            margin-bottom: 6px;
            font-size: 14px;
        }

            color: #555;
            margin-bottom: 16px;

        }

            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
        
        .toast-notification {
            animation: slideUpToast 0.3s ease;
        }
    </style>
</head>

    function showAlert(message, type = 'info') {
        return new Promise((resolve) => {
            const overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            let icon = 'ℹ️';
            if (type === 'success') icon = '✅';
            if (type === 'error') icon = '❌';
            if (type === 'warning') icon = '⚠️';
            overlay.innerHTML = `<div class="modal"><div class="modal-icon">${icon}</div><div class="modal-title">ОТДИС</div><div class="modal-message">${message}</div><button class="modal-button">Хорошо</button></div>`;
            document.body.appendChild(overlay);
            overlay.querySelector('.modal-button').onclick = () => { overlay.remove(); resolve(); };
        });
    }

    function sendFinalRequest() {
        if (!pendingData) return;
        const messageText = pendingData.text;
        
        const isMaxApp = window.WebApp && typeof window.WebApp.shareMaxContent === 'function';
        
        if (isMaxApp) {
            showAlert('📨 Сейчас откроется список чатов.\n\nВыберите "ОТДИС приёмная комиссия" и отправьте сообщение.', 'info').then(() => {
                window.WebApp.shareMaxContent({ text: messageText }).then(result => {
                    if (result.status === 'shared') {
                        showAlert('✅ Заявка отправлена! Специалист свяжется с вами.', 'success');
                    } else {

        } else {

    function showToast(message) {
        var oldToast = document.querySelector('.toast-notification');

        toast.innerHTML = message;

    }

    async function prepareConsultBooking() {
        const name = document.getElementById('consultUserName').value.trim();
        if (!name) { await showAlert('Пожалуйста, введите ваше имя', 'warning'); return; }
        if (name.length < 2) { await showAlert('Имя должно содержать хотя бы 2 символа', 'warning'); return; }
        const phone = document.getElementById('consultPhone').value.trim();
        if (!phone) { await showAlert('Пожалуйста, введите номер телефона', 'warning'); return; }
        const phoneRegex = /^[\+\d\s\-\(\)]{10,}$/;
        if (!phoneRegex.test(phone)) { await showAlert('Введите корректный номер телефона\n(пример: +7 912 345 67 89)', 'warning'); return; }
        
        const text = `ЗАПИСЬ:\nИмя: ${name}\nТелефон: ${phone}\nДата: консультация\nВремя: ${new Date().toLocaleString('ru-RU')}`;
        
        const isMaxApp = window.WebApp && typeof window.WebApp.shareMaxContent === 'function';
        
        if (isMaxApp) {
            showInstructionWithData({ text: text }, 'consult');
        } else {
            await navigator.clipboard.writeText(text);
            clearForms();
            goToMainMenu();
        }
    }

    function initPhoneMask() {
        const fullPhone = document.getElementById('fullPhone');
        if (fullPhone) {
            fullPhone.addEventListener('input', function(e) {
                let value = e.target.value.replace(/\D/g, '');
                if (value.length > 11) value = value.slice(0, 11);
                let formatted = '';
                if (value.length > 0) {
                    formatted = '+7';
                    if (value.length > 1) formatted += ' ' + value.slice(1, 4);
                    if (value.length >= 5) formatted += ' ' + value.slice(4, 7);
                    if (value.length >= 8) formatted += ' ' + value.slice(7, 9);
                    if (value.length >= 10) formatted += ' ' + value.slice(9, 11);
                }
                e.target.value = formatted;
            });
        }
        const consultPhone = document.getElementById('consultPhone');
        if (consultPhone) {
            consultPhone.addEventListener('input', function(e) {
                let value = e.target.value.replace(/\D/g, '');

                }

            });
        }
    }
